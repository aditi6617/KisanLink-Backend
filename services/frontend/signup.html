<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KisanLink | Farmer Signup</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #c8e6c9
                );
        }


        .container {

            width: 90%;

            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);
        }


        .logo {

            text-align: center;

            margin-bottom: 25px;
        }


        .logo-icon {

            font-size: 48px;
        }


        .logo h1 {

            color: #2e7d32;

            font-size: 34px;

            margin-top: 5px;
        }


        .logo p {

            color: #666;

            margin-top: 8px;
        }


        h2 {

            text-align: center;

            color: #333;

            margin-bottom: 25px;
        }


        .form-group {

            margin-bottom: 15px;
        }


        label {

            display: block;

            font-weight: bold;

            color: #333;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }


        input:focus {

            outline: none;

            border-color: #2e7d32;
        }


        button {

            width: 100%;

            padding: 14px;

            background: #2e7d32;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        button:hover {

            background: #1b5e20;
        }


        .message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

            min-height: 20px;
        }


        .login {

            text-align: center;

            margin-top: 20px;

            color: #666;
        }


        .login a {

            color: #2e7d32;

            font-weight: bold;

            text-decoration: none;
        }


        .login a:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        <div class="logo-icon">
            🌾
        </div>

        <h1>
            KisanLink
        </h1>

        <p>
            Smart Farmer Market Linkage
        </p>

    </div>


    <h2>
        Farmer Registration
    </h2>


    <form id="signupForm">


        <div class="form-group">

            <label for="name">
                Farmer Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                maxlength="10"
                required
            >

        </div>


        <div class="form-group">

            <label for="village">
                Village
            </label>

            <input
                type="text"
                id="village"
                placeholder="Enter your village"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >

        </div>


        <button type="submit">
            Create Farmer Account
        </button>


        <div
            class="message"
            id="message">
        </div>


    </form>


    <div class="login">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


</div>


<script>


document.getElementById("signupForm").addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name")
            .value
            .trim();


        const mobile =
            document.getElementById("mobile")
            .value
            .trim();


        const village =
            document.getElementById("village")
            .value
            .trim();


        const password =
            document.getElementById("password")
            .value;


        const confirmPassword =
            document.getElementById("confirmPassword")
            .value;


        const message =
            document.getElementById("message");


        // Validate mobile number

        if (!/^[0-9]{10}$/.test(mobile)) {

            message.textContent =
                "Please enter a valid 10-digit mobile number.";

            message.style.color =
                "#d32f2f";

            return;
        }


        // Validate password length

        if (password.length < 6) {

            message.textContent =
                "Password must contain at least 6 characters.";

            message.style.color =
                "#d32f2f";

            return;
        }


        // Check password

        if (password !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            message.style.color =
                "#d32f2f";

            return;
        }


        // Create farmer object

        const farmer = {

            name: name,

            mobile: mobile,

            village: village,

            password: password

        };


        // Save farmer account

        localStorage.setItem(
            "kisanlink_user",
            JSON.stringify(farmer)
        );


        // Make sure user must login
        localStorage.removeItem(
            "kisanlink_logged_in"
        );


        message.textContent =
            "Account created successfully! Redirecting to login...";

        message.style.color =
            "#2e7d32";


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1200);

    }
);


</script>


</body>
</html>
